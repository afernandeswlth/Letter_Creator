# Render Blueprint — deploy the app as a Docker web service.
# In Render: New → Blueprint → point at this repo. Then set the secret env var.
services:
  - type: web
    name: welcome-letter-generator
    runtime: docker
    plan: starter
    envVars:
      # Set in the Render dashboard (secret — not committed):
      - key: ZAPIER_EMAIL_WEBHOOK_URL
        sync: false
